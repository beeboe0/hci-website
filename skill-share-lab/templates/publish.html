{% extends "base.html" %}
{% block content %}
<div class="screen no-nav">
  <div class="topbar">
    <a class="back" href="javascript:history.back()">←</a>
    <div class="page-title" style="margin:0;">Publish a new product</div>
  </div>
  <div class="card" style="text-align:center;padding:30px 16px;margin-bottom:16px;cursor:pointer;" onclick="toast('Choose a photo of your book')">
    <div style="font-size:2.4rem;">📷</div>
    <div class="muted">Tap to upload a photo</div>
  </div>
  <form method="POST">
    <div class="field">
      <label>Item name</label>
      <input name="title" placeholder="e.g. Computer Networking" required>
    </div>
    <div class="field">
      <label>Author</label>
      <input name="author" placeholder="Book author">
    </div>
    <div class="field">
      <label>Rental price (£ / week)</label>
      <input name="price" type="number" min="0" step="0.1" placeholder="8" required>
    </div>
    <div class="field">
      <label>Subject</label>
      <input name="subject" placeholder="e.g. Networks">
    </div>
    <div class="field">
      <label>Return time window</label>
      <input name="return_window" placeholder="e.g. 10 Dec">
    </div>
    <button class="btn" type="submit">Publish listing</button>
  </form>
</div>
{% endblock %}
