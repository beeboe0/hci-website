{% extends "base.html" %}
{% block content %}
<div class="auth no-nav">
  <div class="logo">📚</div>
  <h1>UEA Skill Share Lab</h1>
  <p class="sub">Borrow, lend and share textbooks with students</p>
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input name="username" type="text" placeholder="Enter your username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
    </div>
    <button class="btn" type="submit">Log in</button>
    <div class="auth-links">
      <span class="link" onclick="toast('Password reset link sent to your email')">Forgot password?</span>
      <a class="link" href="{{ url_for('register') }}">New here? Sign up</a>
    </div>
  </form>
</div>
{% endblock %}
