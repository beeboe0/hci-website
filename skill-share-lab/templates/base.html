<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UEA Skill Share Lab</title>
<style>
  :root{
    --accent:#2f6fed;
    --accent-dark:#1f56c4;
    --green:#2e9e6b;
    --red:#e05252;
    --bg:#f2f4f8;
    --card:#ffffff;
    --text:#1c2333;
    --text-2:#6b7280;
    --line:#e6e9ef;
    --radius:16px;
    --nav-h:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#d9dee8;color:var(--text);
    min-height:100vh;display:flex;justify-content:center;align-items:center;
  }
  /* 固定手机尺寸 402×874 */
  .phone{
    width:402px;height:874px;
    background:var(--bg);position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  @media (max-width:480px){
    body{padding:0;}
    .phone{width:100%;height:100vh;border-radius:0;}
  }
  main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;}
  main::-webkit-scrollbar{width:0;}

  .screen{padding:18px 16px calc(var(--nav-h) + 24px);min-height:100%;}
  .screen.no-nav{padding-bottom:32px;}
  .page-title{font-size:1.35rem;font-weight:700;margin-bottom:14px;}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
  .muted{color:var(--text-2);font-size:.85rem;}
  .btn{
    display:block;width:100%;border:none;border-radius:14px;padding:14px;
    font-size:1rem;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;
  }
  .btn:active{background:var(--accent-dark);}
  .btn.ghost{background:#eef2fb;color:var(--accent);}
  .btn.small{width:auto;padding:9px 16px;font-size:.85rem;border-radius:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .spacer{flex:1;}
  .link{color:var(--accent);font-size:.88rem;cursor:pointer;text-decoration:none;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--text-2);}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:.95rem;background:#fafbfc;color:var(--text);outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;}

  .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;flex-shrink:0;
  }
  .avatar.lg{width:72px;height:72px;font-size:1.5rem;}

  .cover{
    border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;color:#fff;flex-shrink:0;
  }

  /* 底部导航 */
  .bottom-nav{
    position:absolute;left:0;right:0;bottom:0;height:var(--nav-h);background:#fff;
    border-top:1px solid var(--line);display:flex;z-index:20;
  }
  .bottom-nav .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:.68rem;color:var(--text-2);cursor:pointer;border:none;background:none;text-decoration:none;
  }
  .bottom-nav .nav-item .ico{font-size:1.35rem;}
  .bottom-nav .nav-item.active{color:var(--accent);font-weight:600;}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .topbar .back{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;text-decoration:none;color:var(--text);
  }

  .search{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;margin-bottom:14px;
  }
  .search input{border:none;outline:none;flex:1;font-size:.95rem;background:none;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .book-card{background:#fff;border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.06);text-decoration:none;color:var(--text);}
  .book-card .cover{width:100%;height:110px;border-radius:0;font-size:2rem;}
  .book-card .info{padding:10px;}
  .book-card .title{font-size:.88rem;font-weight:600;line-height:1.25;margin-bottom:4px;}
  .book-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .price{font-weight:700;color:var(--accent);}
  .badge{font-size:.7rem;padding:3px 8px;border-radius:8px;}
  .badge.avail{background:#e7f5ee;color:var(--green);}
  .badge.borrowed{background:#fdecec;color:var(--red);}
  .rating{font-size:.78rem;color:#f5a623;}
  .bookmark{cursor:pointer;font-size:1.1rem;}

  .list-row{display:flex;gap:12px;background:#fff;border-radius:var(--radius);padding:12px;margin-bottom:12px;align-items:center;}
  .list-row .cover{width:56px;height:70px;font-size:1.4rem;}
  .tag-green{color:var(--green);font-weight:600;}
  .tag-red{color:var(--red);font-weight:600;}

  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;}
  .tab{
    border:none;background:#fff;border-radius:12px;padding:9px 14px;font-size:.83rem;
    color:var(--text-2);cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:var(--accent);color:#fff;font-weight:600;}

  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);}
  .setting-row:last-child{border-bottom:none;}
  .switch{position:relative;width:48px;height:28px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#cbd2dc;border-radius:28px;transition:.2s;cursor:pointer;}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider:before{transform:translateX(20px);}

  .chat-row{display:flex;gap:12px;background:#fff;border-radius:var(--radius);padding:13px;margin-bottom:10px;cursor:pointer;align-items:center;}
  .chat-row .last{font-size:.82rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .unread{background:var(--red);color:#fff;font-size:.7rem;border-radius:10px;padding:2px 7px;}

  .auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;}
  .auth .logo{font-size:2.2rem;text-align:center;margin-bottom:6px;}
  .auth h1{text-align:center;font-size:1.5rem;margin-bottom:4px;}
  .auth .sub{text-align:center;color:var(--text-2);margin-bottom:28px;}
  .auth-links{display:flex;justify-content:space-between;margin-top:14px;}

  .gallery{height:220px;border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:4rem;color:#fff;}
  .detail-lender{display:flex;align-items:center;gap:12px;margin:16px 0;cursor:pointer;}
  .detail-lender .muted{font-size:.8rem;}

  #toast{
    position:absolute;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%) translateY(20px);
    background:rgba(28,35,51,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:.88rem;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .banner{height:90px;border-radius:var(--radius);background:linear-gradient(120deg,var(--accent),#7aa8ff);margin-bottom:12px;}
  .section-label{font-size:.8rem;font-weight:600;color:var(--text-2);margin:16px 0 8px;}
  .flash-msg{background:#fdecec;color:var(--red);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:.88rem;}
</style>
</head>
<body>
<div class="phone">
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash-msg">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% if session.user_id %}
  <nav class="bottom-nav">
    <a class="nav-item {% if request.path == '/rent' %}active{% endif %}" href="{{ url_for('rent') }}"><span class="ico">🏠</span>Rent</a>
    <a class="nav-item {% if request.path == '/current' %}active{% endif %}" href="{{ url_for('current') }}"><span class="ico">📋</span>Current</a>
    <a class="nav-item {% if request.path == '/finance' %}active{% endif %}" href="{{ url_for('finance') }}"><span class="ico">💰</span>Finance</a>
    <a class="nav-item {% if request.path == '/chat' %}active{% endif %}" href="{{ url_for('chat') }}"><span class="ico">💬</span>Chat</a>
    <a class="nav-item {% if request.path == '/edit_profile' %}active{% endif %}" href="{{ url_for('edit_profile') }}"><span class="ico">👤</span>Profile</a>
  </nav>
  {% endif %}
  <div id="toast"></div>
</div>
<script>
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("show"),1800);
}
</script>
{% block script %}{% endblock %}
</body>
</html>
